services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pokemo}
      MYSQL_USER: ${DB_USERNAME:-pokemo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pokemo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pokemo-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pokemo}
      DB_USERNAME: ${DB_USERNAME:-pokemo}
      DB_PASSWORD: ${DB_PASSWORD:-pokemo}
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret-key-must-be-at-least-32-bytes}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-uploads:
